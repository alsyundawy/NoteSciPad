name: Build NoteSciPad

on:
  push:
    branches:
      - main
      - develop
      - 1.*
  pull_request:
    branches:
      - main
      - develop
      - 1.*
  workflow_dispatch:

env:
  QT_RELEASE_VER: "6.5"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ─── macOS Intel ───────────────────────────────────────────
          - runs_on: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.5"
            deployment_target: "11.0"

          - runs_on: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.8"
            deployment_target: "12.0"

          - runs_on: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.10"
            deployment_target: "13.0"

          # ─── macOS Apple Silicon ───────────────────────────────────
          - runs_on: macos-15
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.5"
            deployment_target: "12.0"

          - runs_on: macos-15
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.8"
            deployment_target: "13.0"

          - runs_on: macos-15
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.10"
            deployment_target: "14.0"

          # ─── Linux Ubuntu ──────────────────────────────────────────
          - runs_on: ubuntu-24.04
            platform: linux
            arch: x64
            cmake_arch: x86_64
            qt_arch: gcc_64
            qt_version: "6.5"

          - runs_on: ubuntu-24.04
            platform: linux
            arch: x64
            cmake_arch: x86_64
            qt_arch: linux_gcc_64
            qt_version: "6.8"

    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ─── Linux System Dependencies ──────────────────────────────
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ninja-build \
            dpkg-dev \
            rpm \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0

      # ─── Install Qt ──────────────────────────────────────────────
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ matrix.qt_version }}
          host: ${{ matrix.platform == 'mac' && 'mac' || 'linux' }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qt5compat
          cache: true

      # ─── Set DISTRIBUTION ────────────────────────────────────────
      - name: Set Distribution (mac)
        if: matrix.platform == 'mac'
        shell: bash
        run: echo "DISTRIBUTION=dmg" >> "$GITHUB_ENV"

      - name: Set Distribution (linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: echo "DISTRIBUTION=bin" >> "$GITHUB_ENV"

      # ─── CMake Configure ─────────────────────────────────────────
      - name: Configure (CMake)
        shell: bash
        run: |
          echo "Configure: run=$GITHUB_RUN_ID runner=${{ matrix.runs_on }} qt=${{ matrix.qt_version }}"
          CMAKE_OPTS=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_DISTRIBUTION="${DISTRIBUTION}")
          if [ "${{ matrix.platform }}" = "mac" ]; then
            CMAKE_OPTS+=(-DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deployment_target }}" -DMAC_ARCH_SUFFIX="${{ matrix.arch }}")
          fi
          echo "CMake options: ${CMAKE_OPTS[*]}"
          cmake "${CMAKE_OPTS[@]}"

      # ─── Build ───────────────────────────────────────────────────
      - name: Build
        shell: bash
        run: cmake --build build --parallel

      # ─── Build MacOS Targets (dmg) ───────────────────────────────
      - name: Build MacOS Targets (dmg)
        if: matrix.platform == 'mac'
        shell: bash
        run: cmake --build build --target dmg --parallel

      # ─── Upload Artifacts ────────────────────────────────────────
      - name: Upload MacOS dmg
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NoteSciPad-macOS-${{ matrix.arch }}-Qt${{ matrix.qt_version }}
          path: build/NoteSciPad*.dmg
          if-no-files-found: warn

      - name: Build Linux Targets (deb, rpm)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cmake --build build --target deb || true
          cmake --build build --target rpm || true

      - name: Upload Linux Binary & Packages (.deb, .rpm)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NoteSciPad-Linux-${{ matrix.arch }}-Qt${{ matrix.qt_version }}
          path: |
            build/src/NoteSciPad
            build/*.deb
            build/*.rpm
          if-no-files-found: warn
