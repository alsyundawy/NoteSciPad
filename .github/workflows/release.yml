name: Release New Build

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Qt version used for the canonical release DMG (must match one of the matrix qt_version values)
  QT_RELEASE_VER: "6.8"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ─── macOS Intel ───────────────────────────────────────────
          - runs_on: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.5"
            deployment_target: "11.0"

          - runs_on: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.8"
            deployment_target: "12.0"

          - runs_on: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.10"
            deployment_target: "13.0"

          - runs_on: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.11"
            deployment_target: "13.0"

          # ─── macOS Apple Silicon ───────────────────────────────────
          - runs_on: macos-15
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.5"
            deployment_target: "12.0"

          - runs_on: macos-15
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.8"
            deployment_target: "13.0"

          - runs_on: macos-15
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.10"
            deployment_target: "14.0"

          - runs_on: macos-15
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.11"
            deployment_target: "14.0"

          # ─── Linux ─────────────────────────────────────────────────
          - runs_on: ubuntu-24.04
            platform: linux
            arch: x64
            cmake_arch: x86_64
            qt_arch: gcc_64
            qt_version: "6.5"

          - runs_on: ubuntu-24.04
            platform: linux
            arch: x64
            cmake_arch: x86_64
            qt_arch: linux_gcc_64
            qt_version: "6.8"

          - runs_on: ubuntu-24.04
            platform: linux
            arch: x64
            cmake_arch: x86_64
            qt_arch: linux_gcc_64
            qt_version: "6.10"

          - runs_on: ubuntu-24.04
            platform: linux
            arch: x64
            cmake_arch: x86_64
            qt_arch: linux_gcc_64
            qt_version: "6.11"

    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libfreetype6-dev \
            libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            rpm dpkg-dev

      # ─── Install Qt ────────────────────────────────────────────────────
      - name: Install Qt
        uses: jdpurcell/install-qt-action@d715fb7cdd4e5661191a794764231398e2c952f2 # v5
        with:
          version: ${{ matrix.qt_version }}
          host: ${{ matrix.platform == 'mac' && 'mac' || 'linux' }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qt5compat
          cache: true

      # ─── Set DISTRIBUTION ──────────────────────────────────────────────
      - name: Set Distribution (mac)
        if: matrix.platform == 'mac'
        shell: bash
        run: echo "DISTRIBUTION=dmg" >> "$GITHUB_ENV"

      - name: Set Distribution (linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: echo "DISTRIBUTION=native" >> "$GITHUB_ENV"

      # ─── CMake Configure ───────────────────────────────────────────────
      - name: Configure (CMake)
        shell: bash
        run: |
          echo "Configure: run=$GITHUB_RUN_ID runner=${{ matrix.runs_on }} qt=${{ matrix.qt_version }} deployment=${{ matrix.deployment_target }}"
          CMAKE_OPTS=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_DISTRIBUTION="${DISTRIBUTION}" -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deployment_target }}")
          if [ "${{ matrix.platform }}" = "mac" ]; then
            CMAKE_OPTS+=(-DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" -DMAC_ARCH_SUFFIX="${{ matrix.arch }}")
          fi
          echo "CMake options: ${CMAKE_OPTS[*]}"
          cmake "${CMAKE_OPTS[@]}"

      # ─── Build ─────────────────────────────────────────────────────────
      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Build MacOS Targets (dmg)
        if: matrix.platform == 'mac'
        shell: bash
        run: cmake --build build --target dmg --parallel

      - name: Build Linux Targets (deb, rpm)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cmake --build build --target deb || true
          cmake --build build --target rpm || true

      - name: Upload Linux Packages (.deb, .rpm)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NoteSciPad-Linux-${{ matrix.arch }}-Qt${{ matrix.qt_version }}
          path: |
            build/*.deb
            build/*.rpm
          if-no-files-found: warn

      # ─── Codesign & Notarization (Automatic if Secrets are Configured) ─
      - name: Codesign and Notarize (macOS)
        if: matrix.platform == 'mac' && env.APPLE_CERTIFICATE_BASE64 != ''
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./scripts/codesign-and-notarize-macos.sh \
            --app "build/install/NoteSciPad.app" \
            --dmg "build/NoteSciPad-v*.dmg" \
            --entitlements "deploy/macos/NoteSciPad.entitlements"

      # ─── Upload Artifacts ──────────────────────────────────────────────
      - name: Upload MacOS dmg
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NoteSciPad-macOS-${{ matrix.arch }}-Qt${{ matrix.qt_version }}
          path: build/NoteSciPad*.dmg
          if-no-files-found: warn

  # GitHub Release job — only runs on tag pushes
  github:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    if: >
      github.repository == 'alsyundawy/NoteSciPad' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or Verify Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: Upload Release Assets
        # For each arch (x64, arm64), upload only the canonical DMG from
        # the default QT_RELEASE_VER build. The DMG is already named
        # NotepadNext-v{VERSION}-{arch}.dmg by PackagingMac.cmake, so we
        # just upload it directly — no extra zip/rename steps needed.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "=== Downloaded artifact directories ==="
          ls -la
          for arch in x64 arm64; do
            dir="NoteSciPad-macOS-${arch}-Qt${QT_RELEASE_VER}"
            echo "Looking for canonical release dir: ${dir}"
            if [ -d "${dir}" ]; then
              # Find the single DMG produced by PackagingMac.cmake
              dmg_file=$(find "${dir}" -maxdepth 1 \( -name 'NoteSciPad*.dmg' -o -name 'NotepadNext*.dmg' \) | head -1)
              if [ -n "${dmg_file}" ]; then
                echo "Uploading ${dmg_file} → release ${RELEASE_TAG}"
                gh release upload "${RELEASE_TAG}" "${dmg_file}" --clobber
              else
                echo "WARNING: No DMG found in ${dir}, skipping ${arch}"
              fi
            else
              echo "WARNING: Directory ${dir} not found — skipping ${arch}"
            fi
          done

      - name: Upload Linux Packages (.deb, .rpm)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          find . \( -name "*.deb" -o -name "*.rpm" \) | while IFS= read -r pkg; do
            echo "Uploading Linux package: ${pkg}"
            gh release upload "${RELEASE_TAG}" "${pkg}" --clobber || true
          done

      - name: Upload Default Editor Script
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -f "scripts/NoteSciPad-Default-Editor.sh" ]; then
            echo "Uploading scripts/NoteSciPad-Default-Editor.sh to release ${RELEASE_TAG}"
            gh release upload "${RELEASE_TAG}" "scripts/NoteSciPad-Default-Editor.sh" --clobber
          fi
