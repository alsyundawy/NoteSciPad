# MegaLinter configuration for NoteSciPad
# Reference: https://megalinter.io/configuration/

# Exclude vendored thirdparty libraries (Scintilla, Lexilla) and build artifacts
ADDITIONAL_EXCLUDED_DIRECTORIES:
  - thirdparty
  - build
  - build-test-fixtures
  - installer
  - deploy/windows
  - .trunk
  - src/languages

FILTER_REGEX_EXCLUDE: (^thirdparty/|^build/|^build-test-fixtures/|^installer/|libcrypto.*\.dll|libssl.*\.dll)

# Disable excessive or irrelevant checks
DISABLE:
  - COPYPASTE
  - SPELL

# Disable DevSkim linter as it produces false positives on documentation URLs and hash routines
DISABLE_LINTERS:
  - REPOSITORY_DEVSKIM

SHOW_ELAPSED_TIME: true
